name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          overwrite-settings: true

      - name: Extract project version from pom.xml
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -oPm1 '(?<=<version>)[^<]+' pom.xml | head -n1)
          if [ -z "$VERSION" ]; then
            echo "ERROR: Failed to parse version from pom.xml" >&2
            exit 1
          fi
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "project_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Project version: ${VERSION}"
          echo "Tag name: ${TAG_NAME}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR}"

      - name: Build with Maven
        run: |
          set -euo pipefail
          mvn -B clean package \
            -DskipTests \
            -Dmaven.javadoc.skip=false \
            -Dmaven.source.skip=false \
            -Dorg.slf4j.simpleLogger.defaultLogLevel=info

      - name: Verify build artifacts
        run: |
          set -euo pipefail
          PROJECT_VERSION=${{ steps.version.outputs.project_version }}
          echo "=== target/ directory contents ==="
          ls -lh target/
          echo ""
          echo "=== Checking required artifacts ==="
          for f in \
            "target/firewall-jdbc-${PROJECT_VERSION}.jar" \
            "target/firewall-jdbc-${PROJECT_VERSION}-sources.jar" \
            "target/firewall-jdbc-${PROJECT_VERSION}-javadoc.jar"; do
            if [ -f "$f" ]; then
              echo "✓ FOUND: $f ($(stat -c%s "$f" 2>/dev/null || echo "size?") bytes)"
            else
              echo "✗ MISSING: $f" >&2
              exit 1
            fi
          done

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          fail_on_unmatched_files: true
          files: |
            target/firewall-jdbc-${{ steps.version.outputs.project_version }}.jar
            target/firewall-jdbc-${{ steps.version.outputs.project_version }}-sources.jar
            target/firewall-jdbc-${{ steps.version.outputs.project_version }}-javadoc.jar
            pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: |
          set -euo pipefail
          DEPLOY_URL="https://maven.pkg.github.com/${GITHUB_REPOSITORY}"
          echo "Deploying to ${DEPLOY_URL}"
          mvn -B deploy \
            -DskipTests \
            -Dmaven.source.skip=true \
            -Dmaven.javadoc.skip=true \
            -DaltDeploymentRepository="github::default::${DEPLOY_URL}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
