name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Extract project version from pom.xml
        id: version
        run: |
          VERSION=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)
          echo "project_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "Project version: ${VERSION}"
          echo "Tag name: ${GITHUB_REF#refs/tags/}"

      - name: Build with Maven
        run: |
          mvn -B clean package \
            -DskipTests=false \
            -Dmaven.javadoc.skip=false \
            -Dsource.skip=false

      - name: Verify build artifacts
        run: |
          echo "Listing target/*.jar:"
          ls -lh target/*.jar || echo "No jar files found"
          echo ""
          echo "Maven dependency tree:"
          mvn -B dependency:tree | grep -E "(mysql|slf4j|firewall)"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            target/firewall-jdbc-${{ steps.version.outputs.project_version }}.jar
            target/firewall-jdbc-${{ steps.version.outputs.project_version }}-sources.jar
            target/firewall-jdbc-${{ steps.version.outputs.project_version }}-javadoc.jar
            pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages
        run: |
          mvn -B deploy \
            -DskipTests \
            -Dmaven.deploy.skip=false \
            -s $GITHUB_WORKSPACE/settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
